trigger:
- master

jobs:

- job: Verify_Nix_Setup
  strategy:
    matrix:
      macSonoma:
        imageName: 'macOS-14'
      macSequoia:
        imageName: 'macOS-15'

  pool:
    vmImage: $(imageName)

  timeoutInMinutes: 120

  steps:
  - script: |
      set -euo pipefail
      echo ">>> Architecture: $(uname -m)"
      echo ">>> macOS version: $(sw_vers -productVersion)"
      # Use the official Nix multi-user installer (--no-daemon is no longer supported on macOS)
      curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
      echo ">>> Nix installed successfully"
    displayName: 'Install Nix'

  - script: |
      . ci/nix-env.sh
      nix --version
      # Enable flakes and nix-command
      mkdir -p ~/.config/nix
      echo "experimental-features = nix-command flakes" > ~/.config/nix/nix.conf
      echo ">>> Nix is available"
    displayName: 'Verify Nix installation'

  - script: |
      . ci/nix-env.sh
      echo ">>> Evaluating flake configuration..."
      nix eval .#darwinConfigurations.my-mac.system --json > /dev/null 2>&1 || \
        nix eval .#darwinConfigurations.my-mac.config.system.build.toplevel --raw > /dev/null
      echo ">>> Flake evaluation succeeded"
    displayName: 'Evaluate Nix flake'

  - script: |
      . ci/nix-env.sh
      echo ">>> Building nix-darwin system closure (this downloads/builds all Nix packages)..."
      nix build .#darwinConfigurations.my-mac.system --no-link --print-build-logs 2>&1 | tail -50
      echo ">>> System closure build succeeded"
    displayName: 'Build system closure'
    timeoutInMinutes: 90

  - script: |
      . ci/nix-env.sh
      echo ">>> Verifying Nix packages are available..."
      bash ci/verify-nix-packages.sh
    displayName: 'Verify Nix packages'

  - script: |
      echo ">>> Verifying Homebrew cask/formula definitions..."
      bash ci/verify-homebrew.sh
    displayName: 'Verify Homebrew formulas and casks'
